name: Database Backup Health Check

on:
  schedule:
    # Every hour, verify a fresh backup exists
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    name: Verify latest backup is fresh (<= 25h)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check backup freshness
        run: chmod +x scripts/db-backup-healthcheck.sh && ./scripts/db-backup-healthcheck.sh
        env:
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          MAX_AGE_HOURS: '25'