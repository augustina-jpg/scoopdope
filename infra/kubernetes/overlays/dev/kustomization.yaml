apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../

namePrefix: dev-

commonLabels:
  environment: development

replicas:
  - name: dev-scoopdope-backend
    count: 1

patchesStrategicMerge:
  - deployment-patch.yaml

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: scoopdope-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

configMapGenerator:
  - name: scoopdope-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - NODE_ENV=development